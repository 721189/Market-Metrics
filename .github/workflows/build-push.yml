name: Build & Push Docker Image

# Backend image for Railway. Promotion path: only commits whose CI run
# succeeded become deployable images. Vercel builds the frontend separately
# on its own (Vite output) — this workflow is backend-only.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    # When triggered by workflow_run, only proceed if CI succeeded. Manual
    # dispatches evaluate this to true (no triggering-run payload).
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the built image
        # Re-derive the single tag exactly as docker/metadata-action does
        # (type=sha with prefix={{branch}}-): ghcr.io/<owner>/<repo>:main-<sha>.
        # The previous hard-coded `:main` tag did not exist, so this step could
        # never pass.
        run: |
          set -e
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-${{ github.sha }}"
          docker pull "$IMAGE"
          docker run -d --name smoke -p 3100:3000 \
            -e PORT=3000 -e APP_ENV=test -e NODE_ENV=test \
            -e FIREBASE_PROJECT_ID=ci-project \
            -e FIRESTORE_DATABASE_ID=ci-db \
            -e STORAGE_BUCKET=ci-bucket \
            -e FIREBASE_AUTH_DOMAIN=ci.firebaseapp.com \
            "$IMAGE"
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3100/health > /dev/null; then break; fi
            sleep 3
          done
          curl -fsS http://localhost:3100/health > /dev/null
          echo "Container smoke test passed: /health 200."
          docker stop smoke && docker rm smoke
