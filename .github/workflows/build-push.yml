name: Build & Push Docker Image

# Backend image for Railway. Promotion path: only commits whose CI run
# succeeded become deployable images. Vercel builds the frontend separately
# on its own (Vite output) — this workflow is backend-only.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    # When triggered by workflow_run, only proceed if CI succeeded. Manual
    # dispatches evaluate this to true (no triggering-run payload).
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the built image
        # Re-derive the single tag exactly as docker/metadata-action does
        # (type=sha with prefix={{branch}}-): ghcr.io/<owner>/<repo>:main-<sha>.
        # The previous hard-coded `:main` tag did not exist, so this step could
        # never pass.
        run: |
          set -e
          # Docker image references MUST be lowercase; github.repository keeps the
          # owner/repo casing ("721189/Market-Metrics"), which docker rejects with
          # "invalid reference format ... must be lowercase". Lowercase the
          # derived name the same way metadata-action normalises the pushed tag.
          REPO=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          # metadata-action's type=sha tag is the SHORT sha (7 chars). Using the
          # full github.sha produced a tag that was never pushed -> manifest unknown.
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE="${{ env.REGISTRY }}/${REPO}:main-${SHA}"
          echo "Smoke-testing $IMAGE"
          docker pull "$IMAGE"
          docker run -d --name smoke -p 3100:3000 \
            -e PORT=3000 -e APP_ENV=test -e NODE_ENV=test \
            -e FIREBASE_PROJECT_ID=ci-project \
            -e FIRESTORE_DATABASE_ID=ci-db \
            -e STORAGE_BUCKET=ci-bucket \
            -e FIREBASE_AUTH_DOMAIN=ci.firebaseapp.com \
            "$IMAGE"
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:3100/health > /dev/null 2>&1; then ok=1; break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' smoke 2>/dev/null)" != "true" ]; then
              echo "container exited before becoming healthy"
              break
            fi
            sleep 3
          done
          if [ "$ok" != "1" ]; then
            echo "::error::image failed its health smoke test; container logs follow"
            docker logs smoke 2>&1 || true
            docker stop smoke > /dev/null 2>&1 || true
            docker rm smoke > /dev/null 2>&1 || true
            exit 1
          fi
          echo "Container smoke test passed: /health 200."
          docker stop smoke && docker rm smoke
